name: Android

# Runs only for mobile Android changes; desktop changes never trigger this workflow.
on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'
  push:
    branches: [master]
    paths:
      - 'apps/android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Android (assembleDebug, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Validates the committed wrapper jar and caches Gradle deps/build cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest :core:triage:test
