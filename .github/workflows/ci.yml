name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Informational only for now: the codebase has pre-existing
      # svelte-check errors unrelated to any single PR. Kept visible so
      # regressions are noticed, but not blocking until the backlog is cleared.
      - name: Type check (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.json
        continue-on-error: true

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Tauri's build script embeds the frontend from `frontendDist` (../dist),
      # so the frontend must be built before the Rust crate will compile.
      - name: Build frontend (required for Tauri compile)
        run: npm run build

      # Informational: the codebase is not yet rustfmt-clean. Surfaced but
      # non-blocking so it doesn't force a repo-wide reformat inside a PR.
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
        continue-on-error: true

      # Informational: existing clippy findings shouldn't block PRs yet.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        continue-on-error: true

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
