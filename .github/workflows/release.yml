name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Create the draft once, up front. tauri-action finds an existing draft by
  # tag, but three jobs racing to create one can leave duplicate drafts.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (re-run), reusing it."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          ## Download

          **macOS:**
          - Apple Silicon (M1/M2/M3): `Apex.Kube.Manager_*_aarch64.dmg`
          - Intel: `Apex.Kube.Manager_*_x64.dmg`

          ## Requirements
          - macOS 11 (Big Sur) or later
          - kubectl installed and configured
          - Valid kubeconfig at ~/.kube/config

          The macOS build is signed with a Developer ID certificate and notarized by Apple, so it opens normally on first launch.
          NOTES
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --draft \
            --prerelease="$PRERELEASE" \
            --title "Apex Kube Manager $GITHUB_REF_NAME" --notes-file notes.md

  build-macos:
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Fail loudly instead of shipping an unsigned build when a secret is
      # missing (an empty APPLE_CERTIFICATE would also break the bundler).
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/release-signing.md)"
              missing=1
            fi
          done
          exit "$missing"

      # notarytool needs the App Store Connect key as a file on disk.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          key_path="$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # The Tauri bundler imports APPLE_CERTIFICATE into a temporary keychain,
      # signs the .app (hardened runtime), notarizes and staples it, then
      # builds and signs the .dmg around the stapled app.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Apex Kube Manager ${{ github.ref_name }}'
          # Uploads into the draft from create-release; the publish job at the
          # end makes it public only if every build and the macOS verify pass.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

      - name: Verify signature and notarization
        env:
          TARGET: ${{ matrix.target }}
          # Optional: set to check the TeamIdentifier. Skipped when unset.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          app="$bundle/macos/Apex Kube Manager.app"
          dmg=$(ls "$bundle"/dmg/*.dmg)

          codesign --verify --deep --strict --verbose=2 "$app"
          # The bundler only warns ("skipping app notarization") when it has no
          # notarization credentials, so require an Apple-notarized verdict and
          # a stapled ticket explicitly.
          assessment=$(spctl -a -vv -t exec "$app" 2>&1)
          echo "$assessment"
          if ! grep -q "source=Notarized Developer ID" <<<"$assessment"; then
            echo "::error::App is not notarized (spctl: $assessment)"
            exit 1
          fi
          xcrun stapler validate "$app"
          codesign --verify --verbose=2 "$dmg"

          if [ -n "$APPLE_TEAM_ID" ]; then
            team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            if [ "$team" != "$APPLE_TEAM_ID" ]; then
              echo "::error::TeamIdentifier is '$team', expected '$APPLE_TEAM_ID'"
              exit 1
            fi
            echo "TeamIdentifier matches: $team"
          fi

          # The bundler notarizes and staples the .app, not the .dmg, so check
          # that the app shipped inside the dmg carries the stapled ticket.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          xcrun stapler validate "$mnt/Apex Kube Manager.app"
          spctl -a -vv -t exec "$mnt/Apex Kube Manager.app"

      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Apex Kube Manager ${{ github.ref_name }}'
          # Uploads into the draft from create-release; the publish job at the
          # end makes it public only if every build and the macOS verify pass.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Apex Kube Manager ${{ github.ref_name }}'
          # Uploads into the draft from create-release; the publish job at the
          # end makes it public only if every build and the macOS verify pass.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Runs only when every build (and the macOS verify step) succeeded, so a
  # failed or unsigned build never leaves a public release behind.
  publish:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE"
